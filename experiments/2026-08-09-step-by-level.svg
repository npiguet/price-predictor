<style>.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t{fill:#ffffff}.t2{fill:#c3c2b7}.rule{stroke:#383835}.reg{fill:#232320}.sa1{stroke:#3987e5}.da1{fill:#3987e5}.sa2{stroke:#d95926}.da2{fill:#d95926}.sa3{stroke:#199e70}.da3{fill:#199e70}.sa4{stroke:#c98500}.da4{fill:#c98500}}</style>
<rect class="bg" width="940" height="614" fill="#fcfcfb"/>
<text x="62" y="28" class="t" fill="#0b0b0b" font-size="15" font-weight="600">Gen-4's edge is in the middle, where a better card is hard but findable</text>
<text x="62" y="48" class="t2" fill="#52514e" font-size="11.5">Mean step over picks 24-45, by the deck score before the pick. 0.5-wide bins; below -3 the tail is too thin to read.</text>
<text x="62" y="63" class="t2" fill="#52514e" font-size="11.5">Left of -1 a bad deck is easy to improve and every agent does it equally.</text>
<text x="62" y="78" class="t2" fill="#52514e" font-size="11.5">Right of +3 nothing is left to add and no agent can find it. Between them gen-4 leads, and gen-3 by less.</text>
<rect class="reg" x="62.0" y="140" width="240.4" height="396" fill="#f2f1ee"/>
<text x="182.2" y="156" fill="#898781" font-size="10.5" text-anchor="middle">any card improves it</text>
<rect class="reg" x="729.9" y="140" width="80.1" height="396" fill="#f2f1ee"/>
<text x="769.9" y="156" fill="#898781" font-size="10.5" text-anchor="middle">nothing left</text>
<text x="769.9" y="169" fill="#898781" font-size="10.5" text-anchor="middle">to add</text>
<text x="62" y="110" class="t2" fill="#52514e" font-size="12" font-weight="600">mean gain from one pick</text>
